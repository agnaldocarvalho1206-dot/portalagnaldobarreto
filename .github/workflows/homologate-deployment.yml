name: Homologate Portal AB Deployment

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Origem HTTPS publicada, por exemplo https://portal.exemplo.com"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOMOLOGATION_BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deployment smoke test
        run: node scripts/smoke-deployment.mjs
