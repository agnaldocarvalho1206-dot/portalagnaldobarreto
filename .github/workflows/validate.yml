name: Validate Portal AB

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://okhdrmnbfhbdmrrlakdj.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_1234567890
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Deployment smoke syntax
        run: node --check scripts/smoke-deployment.mjs
      - name: EasyPanel deploy trigger syntax
        run: node --check scripts/trigger-easypanel-deploy.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Docker production build
        run: |
          docker build --progress=plain \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            -t portal-ab-ci .
      - name: Docker runtime liveness
        shell: bash
        run: |
          check_live() {
            local name="$1"
            local port="$2"
            for i in {1..20}; do
              if curl --fail --silent "http://127.0.0.1:${port}/api/health/live" >/tmp/live.json; then
                cat /tmp/live.json
                docker logs "$name"
                return 0
              fi
              sleep 1
            done
            echo "Container state:"
            docker inspect --format='status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' "$name" || true
            echo "Container logs:"
            docker logs "$name" || true
            return 1
          }

          docker run -d --name portal-ab-runtime \
            -e APP_URL=https://example.test \
            -e DATABASE_URL=postgresql://user:pass@127.0.0.1:5432/portal \
            -e DATABASE_SSL=false \
            -e RATE_LIMIT_HMAC_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -p 127.0.0.1:3100:3000 \
            portal-ab-ci
          check_live portal-ab-runtime 3100
          docker rm -f portal-ab-runtime

          docker run -d --name portal-ab-degraded \
            -p 127.0.0.1:3101:3000 \
            portal-ab-ci
          check_live portal-ab-degraded 3101
          docker logs portal-ab-degraded | grep '"mode":"degraded"'
          docker rm -f portal-ab-degraded
