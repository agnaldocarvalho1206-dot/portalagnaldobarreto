name: Deploy Portal AB Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-ab-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EASYPANEL_DEPLOY_TRIGGER_URL: ${{ secrets.EASYPANEL_DEPLOY_TRIGGER_URL }}
      EASYPANEL_API_URL: ${{ secrets.EASYPANEL_API_URL }}
      EASYPANEL_API_TOKEN: ${{ secrets.EASYPANEL_API_TOKEN }}
      EASYPANEL_PROJECT_NAME: portal-agnaldobarreto
      EASYPANEL_SERVICE_NAME: portal-agnaldobarretoapp
      HOMOLOGATION_BASE_URL: https://agnaldobarreto.tech
      HOMOLOGATION_ADMIN_EMAIL: ${{ secrets.HOMOLOGATION_ADMIN_EMAIL }}
      HOMOLOGATION_ADMIN_PASSWORD: ${{ secrets.HOMOLOGATION_ADMIN_PASSWORD }}
      HOMOLOGATION_CLIENT_EMAIL: ${{ secrets.HOMOLOGATION_CLIENT_EMAIL }}
      HOMOLOGATION_CLIENT_PASSWORD: ${{ secrets.HOMOLOGATION_CLIENT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require EasyPanel deployment trigger
        shell: bash
        run: |
          if [ -z "$EASYPANEL_DEPLOY_TRIGGER_URL" ]; then
            echo "::error::Configure o secret EASYPANEL_DEPLOY_TRIGGER_URL com o Deployment Trigger URL do serviço portal-agnaldobarretoapp no EasyPanel."
            exit 1
          fi
      - name: Start EasyPanel service when API access is configured
        run: node scripts/start-easypanel-service.mjs
      - name: Capture current production build
        id: current-build
        shell: bash
        run: |
          BUILD_ID="$(node -e "fetch(process.env.HOMOLOGATION_BASE_URL+'/build-info.json',{headers:{'Cache-Control':'no-cache'}}).then(async r=>{if(!r.ok)return '';const j=await r.json();return typeof j.buildId==='string'?j.buildId:''}).then(v=>process.stdout.write(v)).catch(()=>{})")"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
      - name: Trigger EasyPanel deploy
        run: node scripts/trigger-easypanel-deploy.mjs
      - name: Ensure EasyPanel service is enabled after deploy trigger
        run: node scripts/start-easypanel-service.mjs
      - name: Homologate published deployment
        env:
          HOMOLOGATION_PREVIOUS_BUILD_ID: ${{ steps.current-build.outputs.build_id }}
        run: node scripts/smoke-deployment.mjs
