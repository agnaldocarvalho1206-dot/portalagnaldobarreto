name: H38 Final Production Smoke

on:
  push:
    branches: [homologacao-h38-smoke-final-producao]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOMOLOGATION_BASE_URL: https://agnaldobarreto.tech
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Final production smoke
        run: node scripts/smoke-deployment.mjs
