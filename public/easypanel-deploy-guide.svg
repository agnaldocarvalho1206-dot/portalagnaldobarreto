<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Publicar Portal Agnaldo Barreto no EasyPanel</title>
  <desc id="desc">Guia visual com sete etapas para publicar o portal em uma VPS Hostinger com EasyPanel.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#031124"/><stop offset="1" stop-color="#071d38"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#0c2949"/><stop offset="1" stop-color="#09203a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="930" cy="120" r="220" fill="#087bd1" opacity=".12"/>
  <circle cx="110" cy="1770" r="260" fill="#00bfff" opacity=".08"/>
  <text x="72" y="110" fill="#54c9ff" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5">PORTAL AGNALDO BARRETO</text>
  <text x="72" y="180" fill="white" font-family="Arial,sans-serif" font-size="55" font-weight="700">Publicar no EasyPanel</text>
  <text x="72" y="225" fill="#a8c0d7" font-family="Arial,sans-serif" font-size="25">Hostinger VPS · guia de implantação</text>
  <line x1="72" y1="275" x2="1008" y2="275" stroke="#1b6da5" stroke-width="2"/>

  <g font-family="Arial,sans-serif">
    <g transform="translate(55 325)"><rect width="970" height="160" rx="22" fill="url(#card)" stroke="#157cc0" stroke-width="2"/><circle cx="85" cy="80" r="48" fill="#096bc0"/><text x="85" y="97" text-anchor="middle" fill="white" font-size="52" font-weight="700">1</text><text x="165" y="72" fill="white" font-size="32" font-weight="700">Criar o projeto</text><text x="165" y="112" fill="#a8c0d7" font-size="23">EasyPanel → New Project → Portal Agnaldo Barreto</text></g>
    <path d="M540 495v46" stroke="#30bfff" stroke-width="6" marker-end="url(#arrow)"/>
    <g transform="translate(55 555)"><rect width="970" height="160" rx="22" fill="url(#card)" stroke="#157cc0" stroke-width="2"/><circle cx="85" cy="80" r="48" fill="#096bc0"/><text x="85" y="97" text-anchor="middle" fill="white" font-size="52" font-weight="700">2</text><text x="165" y="72" fill="white" font-size="32" font-weight="700">Criar PostgreSQL</text><text x="165" y="112" fill="#a8c0d7" font-size="23">Serviço interno · volume persistente · sem porta pública</text></g>
    <path d="M540 725v46" stroke="#30bfff" stroke-width="6"/>
    <g transform="translate(55 785)"><rect width="970" height="160" rx="22" fill="url(#card)" stroke="#157cc0" stroke-width="2"/><circle cx="85" cy="80" r="48" fill="#096bc0"/><text x="85" y="97" text-anchor="middle" fill="white" font-size="52" font-weight="700">3</text><text x="165" y="72" fill="white" font-size="32" font-weight="700">Criar armazenamento privado</text><text x="165" y="112" fill="#a8c0d7" font-size="23">Cloudflare R2 ou bucket S3 · nunca público</text></g>
    <path d="M540 955v46" stroke="#30bfff" stroke-width="6"/>
    <g transform="translate(55 1015)"><rect width="970" height="160" rx="22" fill="url(#card)" stroke="#157cc0" stroke-width="2"/><circle cx="85" cy="80" r="48" fill="#096bc0"/><text x="85" y="97" text-anchor="middle" fill="white" font-size="52" font-weight="700">4</text><text x="165" y="72" fill="white" font-size="32" font-weight="700">Configurar variáveis</text><text x="165" y="112" fill="#a8c0d7" font-size="23">Copiar .env.example · preencher segredos no EasyPanel</text></g>
    <path d="M540 1185v46" stroke="#30bfff" stroke-width="6"/>
    <g transform="translate(55 1245)"><rect width="970" height="160" rx="22" fill="url(#card)" stroke="#157cc0" stroke-width="2"/><circle cx="85" cy="80" r="48" fill="#096bc0"/><text x="85" y="97" text-anchor="middle" fill="white" font-size="52" font-weight="700">5</text><text x="165" y="72" fill="white" font-size="32" font-weight="700">Instalar e fazer build</text><text x="165" y="112" fill="#a8c0d7" font-size="23">npm ci → npm run build · processo em 0.0.0.0:3000</text></g>
    <path d="M540 1415v46" stroke="#30bfff" stroke-width="6"/>
    <g transform="translate(55 1475)"><rect width="970" height="160" rx="22" fill="url(#card)" stroke="#157cc0" stroke-width="2"/><circle cx="85" cy="80" r="48" fill="#096bc0"/><text x="85" y="97" text-anchor="middle" fill="white" font-size="52" font-weight="700">6</text><text x="165" y="72" fill="white" font-size="32" font-weight="700">Executar migrações</text><text x="165" y="112" fill="#a8c0d7" font-size="23">Backup → homologação → node scripts/migrate-postgres.mjs</text></g>
    <path d="M540 1645v46" stroke="#30bfff" stroke-width="6"/>
    <g transform="translate(55 1705)"><rect width="970" height="160" rx="22" fill="#075da5" stroke="#43caff" stroke-width="3"/><circle cx="85" cy="80" r="48" fill="#00a7f0"/><text x="85" y="97" text-anchor="middle" fill="white" font-size="52" font-weight="700">7</text><text x="165" y="72" fill="white" font-size="32" font-weight="700">Domínio, HTTPS e testes</text><text x="165" y="112" fill="#e3f6ff" font-size="23">DNS → certificado → health/live → health/ready</text></g>
  </g>
  <text x="72" y="1895" fill="#789bb8" font-family="Arial,sans-serif" font-size="18">Não publique antes de validar backup, login, permissões e restauração.</text>
</svg>
